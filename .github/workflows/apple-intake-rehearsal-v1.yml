name: Unsigned Apple intake rehearsal v1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-intake:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brianluby/armorer
          ref: cd47288b3b17268af079e882614431f7520caec3
          path: fixture-validator
          persist-credentials: false
      - name: Install exact fixture compiler
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build fixed credential-free fixture validator
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/apple-intake-validator-target
          RUNNER_SCRATCH: ${{ runner.temp }}
        run: |
          python3 -I - <<'PY'
          import os, shutil, subprocess
          from pathlib import Path
          source = Path.cwd() / "fixture-validator"
          destination = Path(os.environ["RUNNER_SCRATCH"]) / "apple-intake-validator-source"
          assert source.is_dir() and not source.is_symlink() and not destination.exists()
          # Keep the fixed validator outside this repository's Cargo workspace.
          shutil.move(str(source), str(destination))
          subprocess.run(["cargo", "build", "--locked", "--manifest-path", str(destination / "Cargo.toml")], check=True)
          PY
      - name: Qualify complete native unsigned handoffs without executing payloads
        env:
          RUNNER_SCRATCH: ${{ runner.temp }}
        run: |
          python3 -I - <<'PY'
          import os, subprocess, sys, venv
          from pathlib import Path
          scratch = Path(os.environ["RUNNER_SCRATCH"])
          environment = scratch / "apple-intake-schema-venv"
          venv.EnvBuilder(with_pip=True).create(environment)
          python = environment / "bin/python"
          subprocess.run([str(python), "-m", "pip", "install", "--require-hashes", "--only-binary=:all:", "-r", "requirements-schema.txt"], check=True)
          code = '''import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          sys.path.insert(0, str(Path.cwd() / "tests"))
          from final_payload_cases_v1 import main
          main()
          '''
          subprocess.run([str(python), "-I", "-c", code, "--armorer", str(scratch / "apple-intake-validator-target/debug/armorer"),
                          "--tool-directory", str(scratch / "apple-intake-native-tools"),
                          "--receipt-directory", str(scratch / "apple-intake-native-receipts")], check=True)
          PY
      - name: Retain inert native bytes and fixture-only source/run receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-intake-native-v1-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apple-intake-native-receipts/
          if-no-files-found: error
          retention-days: 7
