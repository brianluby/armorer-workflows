name: Qualify artifact writer mapping v1
description: Read native job/check and artifact-service records without OIDC, signing or publication
runs:
  using: composite
  steps:
    - name: Prepare the fixed public native Node without reader credentials
      shell: ${{ runner.os == 'Linux' && '/usr/bin/python3 -I {0}' || '/opt/homebrew/bin/python3 -I {0}' }}
      env:
        ARMORER_RUNTIME_ROOT: ${{ github.action_path }}/../../..
        ARMORER_NODE_DIRECTORY: ${{ runner.temp }}/armorer-artifact-writer-node
        ARMORER_WORKFLOW_READ_TOKEN: ''
        ACTIONS_RUNTIME_TOKEN: ''
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        NODE_OPTIONS: ''
        NODE_EXTRA_CA_CERTS: ''
        NODE_TLS_REJECT_UNAUTHORIZED: '1'
        NODE_USE_ENV_PROXY: '0'
        PYTHONPATH: ''
        PYTHONHOME: ''
        LD_PRELOAD: ''
        LD_LIBRARY_PATH: ''
        LD_AUDIT: ''
        GCONV_PATH: ''
        LOCPATH: ''
        GLIBC_TUNABLES: ''
        LD_PROFILE: ''
        LD_PROFILE_OUTPUT: ''
        LD_DEBUG: ''
        LD_DEBUG_OUTPUT: ''
        LD_TRACE_LOADED_OBJECTS: ''
        DYLD_INSERT_LIBRARIES: ''
        DYLD_LIBRARY_PATH: ''
        DYLD_FRAMEWORK_PATH: ''
        DYLD_FALLBACK_LIBRARY_PATH: ''
        DYLD_FALLBACK_FRAMEWORK_PATH: ''
        DYLD_ROOT_PATH: ''
        DYLD_VERSIONED_LIBRARY_PATH: ''
        DYLD_VERSIONED_FRAMEWORK_PATH: ''
        DYLD_IMAGE_SUFFIX: ''
        OPENSSL_CONF: '/dev/null'
        OPENSSL_MODULES: ''
        OPENSSL_ENGINES: ''
        BASH_ENV: ''
        ENV: ''
        LANG: 'C.UTF-8'
        LC_ALL: 'C.UTF-8'
      run: |
        import os
        import sys
        from pathlib import Path
        sys.path.insert(0, os.environ['ARMORER_RUNTIME_ROOT'])
        from armorer_runtime.producer_launcher_v1 import prepare_node
        directory = Path(os.environ['ARMORER_NODE_DIRECTORY'])
        directory.mkdir(mode=0o700)
        prepare_node(directory / 'node')
    - name: Run the fixed read-only native qualification in a sterile child
      uses: brianluby/armorer-workflows/.github/actions/native-artifact-reader-v1@4cdf5d786aebb637c7b41afe53c4d19a8be08ffa
      env:
        ARMORER_RUNTIME_ROOT: ${{ github.action_path }}/../../..
        ARMORER_NODE_DIRECTORY: ${{ runner.temp }}/armorer-artifact-writer-node
        ARMORER_WORKFLOW_READ_TOKEN: ${{ github.token }}
        NODE_OPTIONS: ''
        NODE_EXTRA_CA_CERTS: ''
        NODE_TLS_REJECT_UNAUTHORIZED: '1'
        NODE_USE_ENV_PROXY: '0'
        PYTHONPATH: ''
        PYTHONHOME: ''
        LD_PRELOAD: ''
        LD_LIBRARY_PATH: ''
        LD_AUDIT: ''
        GCONV_PATH: ''
        LOCPATH: ''
        GLIBC_TUNABLES: ''
        LD_PROFILE: ''
        LD_PROFILE_OUTPUT: ''
        LD_DEBUG: ''
        LD_DEBUG_OUTPUT: ''
        LD_TRACE_LOADED_OBJECTS: ''
        DYLD_INSERT_LIBRARIES: ''
        DYLD_LIBRARY_PATH: ''
        DYLD_FRAMEWORK_PATH: ''
        DYLD_FALLBACK_LIBRARY_PATH: ''
        DYLD_FALLBACK_FRAMEWORK_PATH: ''
        DYLD_ROOT_PATH: ''
        DYLD_VERSIONED_LIBRARY_PATH: ''
        DYLD_VERSIONED_FRAMEWORK_PATH: ''
        DYLD_IMAGE_SUFFIX: ''
        OPENSSL_CONF: '/dev/null'
        OPENSSL_MODULES: ''
        OPENSSL_ENGINES: ''
        BASH_ENV: ''
        ENV: ''
        LANG: 'C.UTF-8'
        LC_ALL: 'C.UTF-8'
